# =============================================================================
# baobao-chat 环境实值模板 → 复制到 deploy/helm/bbc/.local-values.yaml（已 gitignore）
# 填密钥（README 步骤 4：openssl rand 生成）后 helm install -f 生效。
# 环境口径：单节点群裸 HTTP 直连（app NodePort 30808 / rustfs NodePort 30900），
# 依赖组件自建于 baobao-chat 命名空间（postgres.yaml / rustfs.yaml）
# =============================================================================
global:
  domain: 172.16.105.109:30808          # BBC_PUBLIC_DOMAIN（信息性：对外基址无域名形态）
  imageRegistry: 172.16.105.109:30003/pengzuyu
  imageTag: "0.1.0"

# bbc-gateway 镜像未交付（单体 app 内嵌 WS）——保持关闭
gateway:
  enabled: false

# 裸 HTTP 直连形态不走 Ingress（bbrt 不支持 TLS）
ingress:
  enabled: false

app:
  replicaCount: 1                       # 首部署求稳（Redis 未接线/跨 pod WS 未验证），稳定后可升 2
  pdb:
    enabled: false                      # 单副本下 PDB 会阻塞驱逐，关闭
  autoscaling:
    enabled: false
  service:
    type: NodePort
    nodePort: 30808                     # 客户端 API/WS 入口：http://<node-ip>:30808

# 依赖组件指向（自建于 baobao-chat 命名空间）
externalServices:
  redis:
    address: bbc-redis.baobao-chat.svc.cluster.local:6379   # 服务端未消费（占位，未部署）
  s3:
    endpoint: http://bbc-rustfs.baobao-chat.svc.cluster.local:9000
    publicEndpoint: http://172.16.105.109:30900   # 预签名直传/票据下载对外基址（NodePort）
    bucket: bbc-data
    backupBucket: bbc-backup
    usePathStyle: true

# ★ 以下四项部署时生成填入（README 步骤 4；与 kubectl create secret 同源同值）
secrets:
  dbDsn: postgres://bbc:CHANGE_ME_PG_PASSWORD@bbc-pg.baobao-chat.svc.cluster.local:5432/bbc?sslmode=disable
  s3AccessKey: CHANGE_ME_S3_AK
  s3SecretKey: CHANGE_ME_S3_SK
  kmsMasterKey: CHANGE_ME_BASE64_32B    # openssl rand -base64 32
  jwtSecret: CHANGE_ME_JWT_32B_PLUS     # openssl rand -hex 32（≥32 字节）

migrateJob:
  enabled: true
