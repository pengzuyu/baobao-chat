# =============================================================================
# BaobaoChat 接入层（K8s；2026-11-23）
#
# 唯一对外入口：Service NodePort 30808 → 本 Deployment（web 镜像）
#   分流：/api /ws /v1 /mcp → bbc-app（helm chart 的 app Service，ClusterIP）
#         /oss → bbc-rustfs（NodePort 30900 仅客户端预签名直连用，不经本层亦可）
#         /update/ → 更新源 PVC； / → 镜像内置官网
# 部署前提：helm chart 已装且 app.service.type=ClusterIP（否者 8080/30808 端口冲突）。
#
# 替换项（部署前 sed 或 kubectl set image）：
#   __IMAGE__  接入层镜像，如 registry.example.internal/baobaochat/web:0.1.4
# =============================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bbc-updates
  namespace: baobao-chat
  labels:
    app.kubernetes.io/name: bbc-web
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
  # storageClassName 留空=集群默认 StorageClass；无默认类时显式指定或改 emptyDir
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bbc-web
  namespace: baobao-chat
  labels:
    app.kubernetes.io/name: bbc-web
    app.kubernetes.io/component: gateway
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate          # 更新源 PVC 是 RWO：滚动会双挂失败
  selector:
    matchLabels:
      app.kubernetes.io/name: bbc-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bbc-web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101      # nginx 镜像内置 nginx 用户
      containers:
        - name: web
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          volumeMounts:
            - name: updates
              mountPath: /usr/share/nginx/updates-root/update
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
      volumes:
        - name: updates
          persistentVolumeClaim:
            claimName: bbc-updates
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: bbc-web
  namespace: baobao-chat
  labels:
    app.kubernetes.io/name: bbc-web
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: bbc-web
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30808