# BaobaoChat 接入层 nginx（K8s 形态；等价 compose 的 nginx-lb + website + update-src）
#
# 上游指向同命名空间 Service 短名（约定）：
#   bbc-app       —— helm chart 渲染的 app Service（port 80 → 容器 8080）
#   bbc-rustfs    —— deploy/k8s/baobao-chat/rustfs.yaml 的 S3 Service（port 9000）
# 与 compose 版差异：无 443 段（K8s 形态 v0.1 走节点裸 HTTP，同 16 篇路线）；
# /update/ 与 / 改为本地静态（镜像内 /usr/share/nginx/{updates,html}）。

worker_processes auto;
events { worker_connections 4096; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65s;
  access_log /dev/stdout;
  error_log /dev/stderr warn;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # 更新源缓存策略：清单禁缓存（发版即生效）；版本路径下的安装包长缓存
  # （注意：不能用「正则 location + alias」区分——正则 location 的 alias 会吃掉
  #  /update/releases/ 前缀段导致 404；用单 location + map 变量控制头部）
  map $uri $update_cache {
    default             "no-store";
    ~^/update/releases/ "public, max-age=31536000, immutable";
  }

  upstream bbc_app {
    ip_hash;                                  # WSS 会话保持（单副本部署时无副作用）
    server bbc-app:80 max_fails=3 fail_timeout=10s;
    keepalive 64;
  }
  upstream bbc_rustfs { server bbc-rustfs:9000; }

  server {
    listen 80;
    server_name _;

    location = /healthz { access_log off; return 200 "ok\n"; }

    # REST API
    location /api/ {
      proxy_pass http://bbc_app;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }

    # WS 长连接（/ws/connect）
    location /ws/ {
      proxy_pass http://bbc_app;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
    }

    # 对象存储预签名直传（D25/D29）：strip 前缀 + Host 透传=SigV4 验签前提
    location /oss/ {
      proxy_pass http://bbc_rustfs/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      client_max_body_size 0;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
    }

    # AI 网关 OpenAI 兼容端点（SSE 流式：关缓冲）
    location /v1/ {
      proxy_pass http://bbc_app;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_read_timeout 300s;
    }

    # MCP 网关（bbrt corp MCP）
    location /mcp/ {
      proxy_pass http://bbc_app;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 客户端更新源（PVC 挂载）：latest.json / release-info.json / releases/**
    location /update/ {
      alias /usr/share/nginx/updates/;
      add_header Cache-Control $update_cache always;
      autoindex off;
    }

    # 官网（镜像内置静态）
    location / {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;
    }
  }
}