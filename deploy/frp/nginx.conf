# BaobaoWork frp 实验台 TLS 终止（路径 B：TCP 隧道 + 自签 CA，端到端加密）
# 对齐 deploy/compose 主栈接入层语义（16 篇 §3.1）。
# 刻意不启 http2：避免部分 WebView 尝试 RFC 8441（WS over h2）带来的升级歧义。

worker_processes auto;
events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;

        # 大文件上传交给应用层/预签名直传，接入层不做 body 限额（与主栈一致）
        client_max_body_size 0;

        # 健康检查（隧道验证用，不记日志）
        location = /healthz {
            access_log off;
            proxy_pass http://bbw:8080/healthz;
        }

        # REST API
        location /api/ {
            proxy_pass http://bbw:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }

        # WSS 长连接（14 篇 /ws/connect）：升级头透传 + 长读超时
        # （> 客户端 30s 心跳的整数倍，避免接入层空闲断连）
        location /ws/ {
            proxy_pass http://bbw:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # 其余路径透传（404 由应用按 14 篇响应包规范返回）
        location / {
            proxy_pass http://bbw:8080;
        }
    }
}
