# =============================================================================
# BaobaoChat Helm values —— 默认【小规模 K8s 档】（16 篇 §3.3 容量表：3 worker 起步）
# 中规模叠加：helm install ... -f values-mid.yaml；大规模：-f values-large.yaml
# 键与 deploy/compose/.env.tpl 一一对应（行内 “compose:” 注释标注来源键）
# =============================================================================

# ---------------------------------------------------------------------------
# 全局
# ---------------------------------------------------------------------------
global:
  domain: bbc.example.internal          # compose: BBC_PUBLIC_DOMAIN
  imageRegistry: registry.example.com/baobaochat   # compose: BBC_IMAGE_REGISTRY
  imageTag: 0.1.0                       # compose: BBC_IMAGE_TAG（同一 tag 锁定，§3.4）
  timezone: Asia/Shanghai
  imagePullSecrets: []                  # 内部 Registry 凭据：[{ name: regcred }]

imagePullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

# ---------------------------------------------------------------------------
# 模块启停（compose 侧等价物 = profiles + BBC_APP_MODULES，§3.4 映射表）
#   auth/org/message 不可关闭；mail 为 infra 开关（对应 compose mail profile）
# ---------------------------------------------------------------------------
modules:
  auth: true
  org: true
  message: true
  file: true
  kb: true
  eco: true
  admin: true
  audit: true
  notify: true
  aigw: true
  mail: false          # ↔ compose mail profile（22 篇；独立组件组，本 chart 未含模板）

# ---------------------------------------------------------------------------
# 特性开关：BBC_FEATURE_*/features.* 随 2026-11 瘦身移除（服务端零读取；租户级灰度走 feature_flag 表阶段二）

# ---------------------------------------------------------------------------
# 非敏感运行配置 → ConfigMap bbc-config
# ---------------------------------------------------------------------------
config:
  logLevel: info                       # compose: BBC_LOG_LEVEL
  updateChannel: stable                # compose: BBC_UPDATE_CHANNEL
  seedDemo: "0"                        # compose: BBC_SEED_DEMO（alice/bob 演示种子；部署保持 0，联调置 1 免 admin bootstrap）
  otelEndpoint: http://otel-collector.observability.svc.cluster.local:4318   # compose: BBC_OTEL_EXPORTER_OTLP_ENDPOINT
  mailDomain: bbc.io                   # compose: BBC_MAIL_DOMAIN
  oidcIssuer: ""                       # compose: BBC_OIDC_ISSUER（生态应用 OIDC 登录的对外 issuer；
                                       #   空=按监听地址推导，内网 NodePort 场景须显式配 http://<node-ip>:30808）（邮箱统一后缀：首超管+批量导入+mail 懒开户；与 brand/brand.json mail_domain 同值）

# ---------------------------------------------------------------------------
# 外部组件（§3.2：PG=CNPG Operator/StatefulSet，Redis=哨兵 StatefulSet，
# 对象存储（D29：RustFS，原 MinIO 移除）=分布式 StatefulSet——由 Operator/独立 release 管理，本 chart 只引用）
# ---------------------------------------------------------------------------
externalServices:
  redis:
    address: bbc-redis.bbc-data.svc.cluster.local:6379      # compose: BBC_REDIS_ADDR
  s3:
    endpoint: http://rustfs.bbc-data.svc.cluster.local:9000  # compose: BBC_S3_ENDPOINT（D29）
    publicEndpoint: ""                                      # compose: BBC_S3_PUBLIC_ENDPOINT（D25 预签名对外基址；
                                                            # 空=本地盘回落；启用须同时给 ingress 加 /oss/ 路由）
    bucket: bbc-data                                        # compose: BBC_S3_BUCKET
    backupBucket: bbc-backup                                # compose: BBC_S3_BACKUP_BUCKET
    usePathStyle: true                                      # compose: BBC_S3_USE_PATH_STYLE

# ---------------------------------------------------------------------------
# 敏感配置 → Secret bbc-db / bbc-s3 / bbc-secrets（不入 git/镜像/日志，§5.3）
# ★ 生产建议改用 external-secrets 引用 KMS/Vault（见 templates/secret.yaml 头注释）
# ---------------------------------------------------------------------------
secrets:
  # 非空则不渲染对应 Secret，改引用集群内既有 Secret（键名见 secret.yaml）
  existingSecretDb: ""                 # 例：bbc-db-vault
  existingSecretS3: ""                 # 例：bbc-s3-vault
  dbDsn: postgres://bbc:CHANGE_ME@bbc-pg-rw.bbc-data.svc.cluster.local:5432/bbc?sslmode=disable   # compose: BBC_DB_DSN
  dbReadDsn: ""                        # compose: BBC_DB_RO_DSN（空=读回落主库）
  s3AccessKey: CHANGE_ME               # compose: BBC_S3_ACCESS_KEY
  s3SecretKey: CHANGE_ME               # compose: BBC_S3_SECRET_KEY
  aiUpstreamApiKey: ""                 # compose: BBC_AI_UPSTREAM_API_KEY
  kmsMasterKey: ""                     # compose: BBC_KMS_MASTER_KEY ★aigw 供应商密钥加密必需
  oidcSigningKey: ""                   # compose: BBC_OIDC_SIGNING_KEY（生态应用用 BaobaoChat 账号登录时必需；
                                       #   ES256 私钥 PEM 或其 base64 单行，scripts/release/gen-oidc-key.sh 生成）
                                       # （openssl rand -base64 32；空=KMS 不初始化，AI 供应商设置不可用）
  jwtSecret: bbc_jwt_change_me_0123456789abcdef0123456789abcdef   # compose: BBC_JWT_SECRET ★上线必改（≥32 字节；空回退开发默认密钥）

# ---------------------------------------------------------------------------
# app：模块化单体 bbc-server（D02 §2；--enable 由 modules.* 推导）
# ---------------------------------------------------------------------------
app:
  replicaCount: 2
  port: 8080
  # 对外暴露形态（16 篇 §3.1 的等价物）：ClusterIP=经 Ingress/gateway 接入；
  # NodePort=裸 HTTP 直连（桌面端 bbrt 不支持 TLS 的内网形态，/ws /api /oss 同端口直达）
  service:
    type: ClusterIP            # ClusterIP | NodePort
    nodePort: ""               # type=NodePort 时生效，如 30808
  resources:                           # requests 极小值=不预留调度面，实际用量由 limit 封顶（内网小集群口径）
    requests:
      cpu: 1m
      memory: 16Mi
    limits:
      cpu: "1"
      memory: 1Gi
  autoscaling:
    enabled: false                     # 小规模默认关（×2 固定副本）
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70 # §3.2：CPU 70%
    queueDepth:                        # §3.2：file/kb 域队列深度（需 prometheus-adapter）
      enabled: false
      metricName: bbc_queue_depth
      metricSelector: ""               # 如：domain=file
      targetAverageValue: "100"
  pdb:
    enabled: true
    minAvailable: 1
  nodeSelector: {}
  tolerations: []
  affinity: {}                         # 大规模：message/admin 就近 PG、audit 独立节点组（§3.2）

# ---------------------------------------------------------------------------
# gateway：WSS/REST 接入层（独立部署，水平扩展）
# bbc-gateway 镜像尚未交付（单体 app 内嵌 WS，D02 阶段三拆分）——默认关闭，
# 关闭时 Ingress 后端回落 -app Service；镜像落地后置 true
# ---------------------------------------------------------------------------
gateway:
  enabled: false
  replicaCount: 2
  port: 8081                           # http+ws（§3.4 镜像清单）
  terminationGracePeriodSeconds: 60    # WS 优雅迁移宽限（D02 §6：60s in-flight ack）
  resources:                           # WSS 单节点 5 万连接 <8GB 为上限（§6.7），小档 2Gi
    requests:
      cpu: 1m
      memory: 16Mi
    limits:
      cpu: "1"
      memory: 2Gi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 4
    # §3.2/§6.7：在线连接数目标 3.5 万/实例、上限 5 万/实例
    # （pods 自定义指标，需 prometheus-adapter 暴露 bbc_ws_connections）
    connectionsMetric:
      name: bbc_ws_connections
      averageValue: "35000"
    targetCPUUtilizationPercentage: 70
  pdb:
    enabled: true
    minAvailable: 1                    # §3.2：PDB minAvailable=1
  nodeSelector: {}
  tolerations: []
  # 多可用区打散（§3.2）：默认软反亲和 hostname + zone，大规模可在 values-large 强化
  antiAffinity:
    enabled: true

# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# Ingress / TLS（15 篇 §3.1 企业 CA；16 篇 §4.7 双证书轮换）
# ---------------------------------------------------------------------------
ingress:
  enabled: true
  className: nginx
  hosts:
    api: bbc.example.internal          # 主入口：/api /ws /update
  tls:
    enabled: true
    secretName: bbc-tls                # 证书由内部 CA 签发后注入（或 cert-manager）
  annotations:
    # WSS：升级头透传 + 长读超时（>心跳 30s 的整数倍，14 篇）
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    # WSS 会话保持：按客户端 IP 哈希（compose 侧等价物 = nginx ip_hash，§3.1）；
    # 精确按 did 粘滞需网关自身一致性哈希（§3.1 要点）
    nginx.ingress.kubernetes.io/upstream-hash-by: "$remote_addr"

# ---------------------------------------------------------------------------
# 迁移 Job（§3.4：DB 迁移 = helm pre-install/upgrade Job，同镜像 bbc-app migrate）
# ---------------------------------------------------------------------------
migrateJob:
  enabled: true
  resources:
    requests: {cpu: 1m, memory: 16Mi}
    limits: {cpu: "1", memory: 512Mi}
