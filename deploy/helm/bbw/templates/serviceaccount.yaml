{{/*
ServiceAccount（16 篇 §3.4：app/gateway/migrate 共用；当前集群内零 K8s API 访问，
仅为部署基线一致性与后续 file/kb 域 operator 化预留）
*/}}
{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "bbw.serviceAccountName" . }}
  labels:
    {{- include "bbw.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
