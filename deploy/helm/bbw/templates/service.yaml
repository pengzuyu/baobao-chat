{{/*
服务暴露：app / gateway（media 见 deployment-media.yaml 内 hostNetwork 说明：
hostNetwork 模式下信令经 Ingress 直连宿主端口，Service 仅作发现占位）
app 可切 NodePort（app.service.*）：裸 HTTP 直连形态（/api /ws 同口直达，
桌面端 bbrt 不支持 TLS 的内网环境）；gateway 关闭时不渲染（bbw-gateway 镜像未交付）
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bbw.fullname" . }}-app
  labels:
    {{- include "bbw.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  type: {{ .Values.app.service.type }}
  selector:
    {{- include "bbw.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: app
  ports:
    - name: http
      port: 80
      targetPort: http
      {{- if and (eq .Values.app.service.type "NodePort") .Values.app.service.nodePort }}
      nodePort: {{ .Values.app.service.nodePort }}
      {{- end }}
---
{{- if .Values.gateway.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bbw.fullname" . }}-gateway
  labels:
    {{- include "bbw.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  type: ClusterIP
  selector:
    {{- include "bbw.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
  ports:
    - name: http-ws
      port: 80
      targetPort: http-ws
---
{{- end }}
{{- if .Values.modules.media }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bbw.fullname" . }}-media
  labels:
    {{- include "bbw.labels" . | nindent 4 }}
    app.kubernetes.io/component: media
spec:
  type: ClusterIP
  selector:
    {{- include "bbw.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: media
  ports:
    - name: signaling
      port: {{ .Values.media.signalingPort }}
      targetPort: signaling
{{- end }}
