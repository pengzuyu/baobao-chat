{{/*
 =============================================================================
 敏感配置 → Secret（16 篇 §3.4：BBW_DB_DSN / BBW_S3_* 等；§5.3 敏感配置红线：
 不入 git、不入镜像、不入日志）
 -----------------------------------------------------------------------------
 external-secrets 兼容（生产推荐）：
 本模板默认从 values.secrets.* 直渲染三个 Secret：
   bbw-db     : dbDsn / dbReadDsn
   bbw-s3     : s3AccessKey / s3SecretKey
   <release>-secrets : aiUpstreamApiKey / onlyofficeJwtSecret / turnSecret
 切换为 external-secrets（ESO）接管时：
   1) values 设置 secrets.existingSecretDb / existingSecretS3 指向 ESO 生成的
      Secret 名（本模板即跳过 bbw-db / bbw-s3 的渲染，只保留引用）；
   2) 在独立 release 中声明（示例，密钥源为 Vault/KMS，轮换走 15 篇 §4.1）：

      apiVersion: external-secrets.io/v1beta1
      kind: ExternalSecret
      metadata:
        name: bbw-db
        namespace: bbw
      spec:
        refreshInterval: 1h
        secretStoreRef: { name: vault-backend, kind: ClusterSecretStore }
        target: { name: bbw-db }
        data:
          - secretKey: dbDsn
            remoteRef: { key: baobaowork/prod, property: db_dsn }
          - secretKey: dbReadDsn
            remoteRef: { key: baobaowork/prod, property: db_read_dsn }

   3) <release>-secrets（ai/onlyoffice/turn 键）同理整表接管后，可将本文件
      尾部第三个 Secret 块删除或加条件开关（键名保持不变即可无缝替换）。
 =============================================================================
*/}}
{{- if not .Values.secrets.existingSecretDb }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bbw.secretName.db" . }}
  labels:
    {{- include "bbw.labels" . | nindent 4 }}
  annotations:
    # 凭据轮换流程：15 篇 §4.1（双凭据过渡 → 切换 → 撤旧）
    bbw.example.internal/rotate-policy: "15篇§4.1"
type: Opaque
stringData:
  dbDsn: {{ .Values.secrets.dbDsn | quote }}
  dbReadDsn: {{ .Values.secrets.dbReadDsn | quote }}
{{- end }}
---
{{- if not .Values.secrets.existingSecretS3 }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bbw.secretName.s3" . }}
  labels:
    {{- include "bbw.labels" . | nindent 4 }}
type: Opaque
stringData:
  s3AccessKey: {{ .Values.secrets.s3AccessKey | quote }}
  s3SecretKey: {{ .Values.secrets.s3SecretKey | quote }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bbw.secretName.app" . }}
  labels:
    {{- include "bbw.labels" . | nindent 4 }}
type: Opaque
stringData:
  aiUpstreamApiKey: {{ .Values.secrets.aiUpstreamApiKey | quote }}
  onlyofficeJwtSecret: {{ .Values.secrets.onlyofficeJwtSecret | quote }}
  turnSecret: {{ .Values.secrets.turnSecret | quote }}
