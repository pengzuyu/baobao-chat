apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bbw.fullname" . }}-app
  labels:
    {{- include "bbw.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  {{- if not .Values.app.autoscaling.enabled }}
  replicas: {{ .Values.app.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "bbw.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: app
  strategy:
    # §4.4 滚动升级：先增后减，接入层（gateway）最后切换
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "bbw.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: app
      annotations:
        # 配置变更触发滚动（Secret 内容不注入 checksum，避免泄露；凭据轮换走 15 篇 §4.1）
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "bbw.serviceAccountName" . }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532          # distroless nonroot（§3.4 镜像清单）
        fsGroup: 65532
      containers:
        - name: bbw-server
          # 模块化单体：--enable 控制启用域（D02 §2；由 values.modules.* 推导，
          # 与 compose 侧 BBW_APP_MODULES 等价）
          args: ["--enable", "{{ include "bbw.app.enabledModules . }}"]
          image: {{ include "bbw.image" (dict "root" $ "repo" "bbw-app") }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          env:
            - name: TZ
              value: {{ .Values.global.timezone | quote }}
            # DB / S3 凭据：来自 Secret bbw-db / bbw-s3（§3.4 配置等价映射）
            - name: BBW_DB_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ include "bbw.secretName.db" . }}
                  key: dbDsn
            - name: BBW_DB_RO_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ include "bbw.secretName.db" . }}
                  key: dbReadDsn
            - name: BBW_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "bbw.secretName.s3" . }}
                  key: s3AccessKey
            - name: BBW_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "bbw.secretName.s3" . }}
                  key: s3SecretKey
            - name: BBW_AI_UPSTREAM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "bbw.secretName.app" . }}
                  key: aiUpstreamApiKey
          envFrom:
            - configMapRef:
                name: {{ include "bbw.fullname" . }}-config
          ports:
            - name: http
              containerPort: {{ .Values.app.port }}
              protocol: TCP
          livenessProbe:
            # §3.4 镜像清单：/healthz
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            # §3.4 镜像清单：/readyz（滚动升级 readinessGate 依据，§3.4 升级表）
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.app.resources | nindent 12 }}
      {{- with .Values.app.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.app.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.app.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
