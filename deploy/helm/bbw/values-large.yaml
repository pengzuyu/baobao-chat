# =============================================================================
# 大规模档覆盖（16 篇 §3.3：20k 用户/租户 / 6k 在线 / 5,000 msg/s；8–12 worker）
# 用法：helm upgrade --install bbw deploy/helm/bbw -f deploy/helm/bbw/values-large.yaml -n bbw --create-namespace
# 仅列出相对 values.yaml 的差异键
# =============================================================================

app:
  # §3.3：域拆分部署（message 3–4 副本 4C；audit 独立节点组）
  # TODO：域拆分 = 同一 bbw-app 镜像按 --enable 分域多 Deployment（D02 §2 拆分
  # 原则），当前 chart 渲染单体 Deployment，域拆分清单见 16 篇 §3.2 组件表；
  # 先以副本数+资源抬高承载，压测后落地分域模板。
  replicaCount: 4
  resources:
    requests: {cpu: "2", memory: 4Gi}
    limits: {cpu: "4", memory: 8Gi}
  autoscaling:
    enabled: true
    minReplicas: 4
    maxReplicas: 10
    queueDepth:
      enabled: true                    # file/kb worker 队列深度参与伸缩（§3.2）
      metricName: bbw_queue_depth
      metricSelector: ""
      targetAverageValue: "200"
  affinity:
    # message/admin 就近 PG（§3.2 亲和性约束）
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: bbw.nodeclass
                operator: In
                values: [app]

gateway:
  replicaCount: 3
  autoscaling:
    minReplicas: 3
    maxReplicas: 8                     # §6.7：5 万连接/实例上限内
  resources:
    requests: {cpu: "1", memory: 2Gi}
    limits: {cpu: "4", memory: 8Gi}

media:
  replicas: 3                          # §3.3：500 路（3–4 专用节点）
  nodeSelector:
    bbw.media: "true"                  # 专用节点组（万兆）
  tolerations:
    - key: bbw/media
      operator: Exists
      effect: NoSchedule               # §3.2：节点污点隔离
  resources:
    requests: {cpu: "8", memory: 16Gi}
    limits: {cpu: "16", memory: 32Gi}
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 6

# 外部组件容量（§3.3 大档基线）：
#   PG 主+2 读副本 16C32G：shared_buffers 8G、池 200、消息表按月分区+索引膨胀监控
#   Redis 哨兵 3×4G（热 key 监控）；MinIO 4+ 节点 40TB（EC，跨站点复制可选）
#   ai-gateway 独立 ×2；嵌入/重排 GPU 节点按 KB 规模另计（01 篇开放问题 3）
