# =============================================================================
# BaobaoChat 单 VM 全量拓扑（docker-compose，16 篇 §3.1 / §3.3 / §3.4）
# -----------------------------------------------------------------------------
# · compose spec 语法（无 version 字段），Docker Compose v2.20+。
# · profiles 分组（16 篇 §3.4 模块启停 = compose profiles ↔ Helm values.modules.*）：
#     core   核心链路：nginx-lb / app×2 / pg16 / redis7 / rustfs / update-src / 初始化
#     deps   开发依赖子组（core 去掉 app/nginx-lb：宿主直跑 server 的开发流；
#            dev-up.sh 用此组——不起 app 容器、不占宿主 80/443）
#     ops    可观测栈：prometheus / grafana / otel-collector / alertmanager
#     mail   邮件栈（22 篇，可选）：stalwart 占位（或替换 docker-mailserver 组件组）
#   ★ 所有组均需显式启用，例如：docker compose --profile core up -d
#     （scripts/dev-up.sh 与 README 已封装常用组合）
# · 镜像版本一律钉死；BBC 自有镜像与 Helm 共用同一 tag 锁定（§3.4“同一组镜像”），
#   生产建议再叠加 @sha256 digest 双重钉死（TODO：CI 注入）。
# · 配置键与 Helm values 一一对应，见同目录 .env.tpl 行内 “helm:” 注释。
# =============================================================================

# 显式 project 名：与仓库目录名解耦（目录更名后容器/网络/卷前缀保持 baobao-chat）
name: baobao-chat

x-logging: &default-logging
  # 日志轮转（低日志量服务沿用引擎默认即可）
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

x-bbc-env: &bbc-env
  # —— 统一配置键（与 Helm 完全一致；K8s 来源见 helm/bbc/templates/configmap.yaml）——
  TZ: Asia/Shanghai
  BBC_PUBLIC_DOMAIN: ${BBC_PUBLIC_DOMAIN:-bbc.example.internal}
  BBC_LOG_LEVEL: ${BBC_LOG_LEVEL:-info}
  BBC_DB_DSN: ${BBC_DB_DSN}
  BBC_DB_RO_DSN: ${BBC_DB_RO_DSN:-}
  # HS256 签名密钥（03 篇 §2.2；≥32 字节；空回退开发默认密钥并打警告日志，生产必改）
  BBC_JWT_SECRET: ${BBC_JWT_SECRET:-}
  # KMS 主密钥（aigw 供应商密钥信封加密；helm: secrets.kmsMasterKey → Secret bbc-secrets）：
  # base64(32B)；空=带密钥的供应商无法创建/装配（仅警告不阻断）——容器化联调须与
  # 宿主 dev（server/.env.dev）同一把钥匙，否则存量 kms:v1 密文全部跳过
  BBC_KMS_MASTER_KEY: ${BBC_KMS_MASTER_KEY:-}
  # OIDC Provider（D28 批次 Q1）：ES256 私钥 PEM + 对外 issuer；空=临时密钥仅联调
  BBC_OIDC_SIGNING_KEY: ${BBC_OIDC_SIGNING_KEY:-}
  BBC_OIDC_ISSUER: ${BBC_OIDC_ISSUER:-}
  # 文件域本地盘（容器内固定 /data，卷 bbc-data 持久化；对象存储阶段二替换，07 篇 §4）
  BBC_DATA_DIR: ${BBC_DATA_DIR:-/data}
  # 演示种子数据（alice/bob 口令 demo-pass-123）：部署环境默认关；联调置 1 可免引导
  BBC_SEED_DEMO: ${BBC_SEED_DEMO:-0}
  # CORS 白名单（逗号分隔；空=服务端默认 http://localhost:5173 即 tauri dev origin）
  BBC_CORS_ORIGINS: ${BBC_CORS_ORIGINS:-}
  BBC_REDIS_ADDR: ${BBC_REDIS_ADDR:-redis:6379}
  BBC_S3_ENDPOINT: ${BBC_S3_ENDPOINT:-http://rustfs:9000}
  # 预签名对外基址（D25）：客户端直传/直下走它，签名按对外 host 计算（nginx strip+Host 透传）。
  # ★生产必填：留空=回落 http://rustfs:9000（容器内地址）→ 客户端拿到不可达 URL，文件上传失败。
  # 域名形态 http(s)://host/oss（compose 默认拓扑）；内网直连形态 http://ip:9000
  BBC_S3_PUBLIC_ENDPOINT: ${BBC_S3_PUBLIC_ENDPOINT:-}
  BBC_S3_USE_PATH_STYLE: ${BBC_S3_USE_PATH_STYLE:-true}
  BBC_S3_BUCKET: ${BBC_S3_BUCKET:-bbc-data}
  BBC_S3_BACKUP_BUCKET: ${BBC_S3_BACKUP_BUCKET:-bbc-backup}
  BBC_S3_ACCESS_KEY: ${BBC_S3_ACCESS_KEY}
  BBC_S3_SECRET_KEY: ${BBC_S3_SECRET_KEY}
  BBC_OTEL_EXPORTER_OTLP_ENDPOINT: ${BBC_OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
  BBC_UPDATE_CHANNEL: ${BBC_UPDATE_CHANNEL:-stable}
  BBC_AI_UPSTREAM_BASE_URL: ${BBC_AI_UPSTREAM_BASE_URL:-}
  BBC_AI_UPSTREAM_API_KEY: ${BBC_AI_UPSTREAM_API_KEY:-}
  # 品牌白标（D31；2026-11-18 补透传——.env.tpl 同名键此前未进容器走服务端默认值的缺口）
  BBC_BRAND_NAME: ${BBC_BRAND_NAME:-BaobaoChat}
  BBC_DEEP_LINK_SCHEME: ${BBC_DEEP_LINK_SCHEME:-bbc}
  BBC_MAIL_DOMAIN: ${BBC_MAIL_DOMAIN:-bbc.io}   # 邮箱统一后缀（首超管+单建/导入/注册+mail 懒开户；唯一权威源——前端经 /config/public 运行时取；2026-11-26 brand.json mail_domain 字段退役）

services:
  # ===========================================================================
  # nginx-lb：TLS 终止 + 反向代理 + WSS 会话保持（16 篇 §3.1）
  # 小规模档 gateway 并入 nginx-lb（§3.3“gateway 并入”行），接入层在升级顺序中
  # 最后切换（§4.4 第 3 步）。
  # ===========================================================================
  nginx-lb:
    image: ${NGINX_IMAGE:-nginx:1.27.4-alpine3.21}
    profiles: [core]
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"      # https/wss 主入口（客户端 + Web 管理台）
    volumes:
      # 证书目录：volumes/certs/tls.crt|tls.key|ca.crt（15 篇 §3.1；开发自签见 scripts/dev-up.sh）
      - ./volumes/certs:/etc/nginx/certs:ro
    configs:
      - source: nginx-conf
        target: /etc/nginx/nginx.conf
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      app:
        condition: service_healthy

  # ===========================================================================
  # app×2：模块化单体 bbc-server（auth/org/message/file/doc/kb/eco/admin/audit/
  # notify/aigw，D02 §2；--enable 控制启用域）。副本 2 = 滚动升级 + 单实例冗余。
  # 扩缩容：docker compose --profile core up -d --scale app=N
  # ===========================================================================
  app:
    image: ${BBC_IMAGE_REGISTRY:-registry.example.com/baobaochat}/bbc-app:${BBC_IMAGE_TAG:-0.1.0}
    profiles: [core]
    restart: unless-stopped
    logging: *default-logging
    command: ["--enable", "${BBC_APP_MODULES:-auth,org,message,file,kb,eco,admin,audit,notify,aigw}"]
    environment: *bbc-env
    volumes:
      - bbc-data:/data          # 文件域本地盘（BBC_DATA_DIR=/data；对象存储阶段二替换）
    expose:
      - "8080"         # http + ws（app 内嵌模式；独立 gateway 拆分见 K8s 形态 §3.2）
    healthcheck:
      # bbc-app 为 distroless（无 shell/wget）：镜像内自带静态编译 /healthprobe，
      # 探测 /healthz（§3.4 镜像清单）。TODO：CI 断言镜像内 /healthprobe 存在。
      test: ["CMD", "/healthprobe", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      pg:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy

  # ===========================================================================
  # app-init：首次初始化（幂等）。等待 pg 就绪 → 执行 /migrations → 引导内置管理员
  # 提示（16 篇 §2.2 初始化工具；正式 migrate 通道为 bbc-app migrate，§3.4）
  # ===========================================================================
  app-init:
    # 借用 postgres 镜像的 psql/pg_isready 执行 init 脚本（bbc-app 为 distroless 无 shell）
    image: ${POSTGRES_IMAGE:-postgres:16.4-alpine3.20}   # 国内网络可指内网/加速镜像，如 registry.example.internal/baobaochat/postgres-pgvector:16（含 pgvector）
    profiles: [core, deps]
    restart: "no"
    entrypoint: ["sh", "/init/01-init.sh"]
    environment:
      POSTGRES_HOST: pg
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-bbc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-bbc}
      BBC_ADMIN_BOOTSTRAP_PASSWORD: ${BBC_ADMIN_BOOTSTRAP_PASSWORD:-}
    volumes:
      - ./init:/init:ro
      # golang-migrate 迁移目录（D02 §7 按域分目录）；server/ 未落地前目录可为空
      - ${BBC_MIGRATIONS_DIR:-../../server/migrations}:/migrations:ro   # 2026-11-16 后已不使用：迁移走 bbc-server 内嵌通道（基线见 server/migrations/0001_init.sql）；挂载保留供人工排查
    depends_on:
      pg:
        condition: service_healthy

  # ===========================================================================
  # pg 16：主实例 + WAL 归档（16 篇 §3.1/§4.6）
  # 容量基线（§3.3 1k 档）：2C4G、shared_buffers 1G、应用侧连接池 50
  # ===========================================================================
  pg:
    image: ${POSTGRES_IMAGE:-postgres:16.4-alpine3.20}   # 国内网络可指内网/加速镜像，如 registry.example.internal/baobaochat/postgres-pgvector:16（含 pgvector）
    profiles: [core, deps]
    restart: unless-stopped
    logging: *default-logging
    environment:
      TZ: Asia/Shanghai
      POSTGRES_USER: ${POSTGRES_USER:-bbc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-bbc}
      # pgvector / zhparser 扩展官方镜像未内置：生产需自建镜像预装（13 篇）；
      # init/01-init.sh 对 CREATE EXTENSION 失败仅告警不阻断。
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      # WAL 连续归档到独立卷（§4.6：RPO≤5min；生产换 pgBackRest/WAL-G → 对象存储 bbc-backup 桶）
      - archive_command=test ! -f /wal_archive/wal/%f && cp %p /wal_archive/wal/%f
      - -c
      - wal_level=replica
      - -c
      - shared_buffers=1GB
      - -c
      - max_connections=100
    volumes:
      - pg-data:/var/lib/postgresql/data
      - pg-wal-archive:/wal_archive
    ports:
      - "127.0.0.1:5432:5432"   # 仅本机调试（宿主机 go run）；生产可移除
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bbc} -d ${POSTGRES_DB:-bbc}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  # ===========================================================================
  # redis 7：缓存/队列（仅缓存用途；AOF 持久化关闭优先，16 篇 §3.2）
  # ===========================================================================
  redis:
    image: ${REDIS_IMAGE:-redis:7.4.1-alpine3.20}
    profiles: [core, deps]
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "no", "--maxmemory", "1gb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # ===========================================================================
  # rustfs：单节点对象存储（t/{tenant_id}/ 前缀多租户布局，13 篇 §6；单节点 2TB 档）
  # D29：MinIO（AGPL+上游归档）→ RustFS（Apache-2.0）；S3 API/端口/卷语义平移
  # ===========================================================================
  rustfs:
    image: ${RUSTFS_IMAGE:-rustfs/rustfs:1.0.5}
    profiles: [core, deps]
    restart: unless-stopped
    environment:
      # 规范键名（MINIO_ROOT_* 别名已弃用不用）；默认凭据 rustfsadmin 公开已知=必须显式设置
      RUSTFS_ACCESS_KEY: ${BBC_S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${BBC_S3_SECRET_KEY}
    volumes:
      - rustfs-data:/data
    ports:
      - "127.0.0.1:9001:9001"   # 运维控制台（仅本机/SSH 隧道访问）
    healthcheck:
      # 就绪语义（存储+IAM 全绿才 200）；/minio/health/live 兼容别名亦在
      test: ["CMD", "curl", "-f", "http://localhost:9000/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # 桶初始化（幂等）：bbc-data（版本化，误删恢复 §4.6）+ bbc-backup（独立备份桶）
  # D29：mc（AGPL）退役 → aws-cli（Apache-2.0）全走标准 S3 API
  rustfs-init:
    image: ${AWS_CLI_IMAGE:-amazon/aws-cli:2.31.4}
    profiles: [core, deps]
    restart: "no"
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        # 桶初始化占位脚本（生产建议换为 KMS 托管的独立备份桶凭据，15 篇 §3.3）
        aws s3api create-bucket --bucket bbc-data || true
        aws s3api put-bucket-versioning --bucket bbc-data \
          --versioning-configuration Status=Enabled || true
        aws s3api create-bucket --bucket bbc-backup || true
        # bbc-releases：客户端安装包（D39 管理后台发布）；匿名只读——接入层 nginx
        # 无凭证代理直出（内网口径；制品完整性由 minisign 签名保证）
        aws s3api create-bucket --bucket bbc-releases || true
        aws s3api put-bucket-policy --bucket bbc-releases --policy \
          '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":"*","Action":["s3:GetObject"],"Resource":["arn:aws:s3:::bbc-releases/*"]}]}' || true
        # CORS（D25 预签名直传：webview fetch PUT/GET 需过预检；预签名 URL 即凭证无
        # Authorization 头，通配 origin 无泄露面——签名本身即授权）
        aws s3api put-bucket-cors --bucket bbc-data --cors-configuration \
          '{"CORSRules":[{"AllowedOrigins":["*"],"AllowedMethods":["GET","PUT","POST","HEAD"],"AllowedHeaders":["content-type","x-amz-*"],"ExposeHeaders":["ETag"],"MaxAgeSeconds":3600}]}' || true
        echo "[rustfs-init] 桶初始化完成：bbc-data(版本化) / bbc-backup（CORS 已配）"
    environment:
      AWS_ACCESS_KEY_ID: ${BBC_S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${BBC_S3_SECRET_KEY}
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://rustfs:9000

  # ===========================================================================
  # update-src：客户端更新静态源（16 篇 §5.1 → D21 落地；nginx-alpine 基）
  # bind 卷 volumes/updates/（rsync 直写，publish.sh 发布）：
  #   latest.json（Tauri updater 标准清单）/ release-info.json（官网数据源）/
  #   releases/v<ver>/…（按版本不可变布局：安装包 + .sig）
  # 正式 bbc-update-src 镜像（灰度/ed25519 签名清单）后续经 BBC_UPDATE_SRC_IMAGE 替换
  # ===========================================================================
  update-src:
    image: ${BBC_UPDATE_SRC_IMAGE:-${NGINX_IMAGE:-nginx:1.27.4-alpine3.21}}
    profiles: [core, deps]
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ./volumes/updates:/srv/updates:ro
    configs:
      # 健康探测（/update-ok）与发布物解耦；清单 no-store / 安装包长缓存
      - source: updates-src-conf
        target: /etc/nginx/conf.d/default.conf
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/update-ok"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ===========================================================================
  # website：官网静态站（D21）——nginx-alpine serve volumes/website/（rsync 发布）
  # 未发布时根路径回占位提示（try_files 回落），健康探测不依赖发布物
  # ===========================================================================
  website:
    image: ${NGINX_IMAGE:-nginx:1.27.4-alpine3.21}
    profiles: [core]
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - ./volumes/website:/usr/share/nginx/html:ro
    configs:
      - source: website-conf
        target: /etc/nginx/conf.d/default.conf
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/website-ok"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ===========================================================================
  # 可观测栈（ops profile）：prometheus / grafana / otel-collector / alertmanager
  # 指标清单与告警规则见 16 篇 §6；K8s 形态为独立监控 namespace（§3.2）
  # ===========================================================================
  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: [ops]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d   # 指标保留 30d（§3.2）
    volumes:
      - prometheus-data:/prometheus
    configs:
      - source: prometheus-conf
        target: /etc/prometheus/prometheus.yml
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.0
    profiles: [ops]
    restart: unless-stopped
    configs:
      - source: otel-conf
        target: /etc/otelcol-contrib/config.yaml
    # 镜像为 distroless 系，无法 exec 健康探测；已启用 health_check 扩展(13133)，
    # 由 prometheus 侧拉取指标判断（TODO：接入 kubelet/引擎探测）
    expose:
      - "4317"    # OTLP gRPC
      - "4318"    # OTLP HTTP（app 的 BBC_OTEL_EXPORTER_OTLP_ENDPOINT 指向此处）
      - "13133"   # health_check 扩展
      - "8889"    # prometheus exporter（供 prometheus 抓取）
    depends_on:
      prometheus:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.4.0
    profiles: [ops]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-grafana_change_me}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      # TODO: 看板 JSON（16 篇 §6.4 八块看板）随制品分发后取消下行注释
      # - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"   # 仅本机/SSH 隧道访问
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      prometheus:
        condition: service_healthy

  alertmanager:
    image: prom/alertmanager:v0.27.0
    profiles: [ops]
    restart: unless-stopped
    # 告警路由（Webhook→IM）配置 TODO：接 16 篇 §6.5 告警规则表与值班通道
    ports:
      - "127.0.0.1:9093:9093"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9093/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ===========================================================================
  # mail（mail profile，可选，22 篇）：stalwart 一体化邮件栈占位
  # 上线前置：DNS 五项检测（MX/SPF/DKIM/DMARC/autodiscover）+ 证书 + SSO 桥接。
  # 备选形态：docker-mailserver 组件组（postfix/dovecot/rspamd）。
  # TODO：健康探测依赖镜像内置 curl，正式接入时按 22 篇校准（遗留项见 README）
  # ===========================================================================
  mail:
    image: stalwartlabs/mail-server:0.10.7
    profiles: [mail]
    restart: unless-stopped
    environment:
      MAIL_DOMAIN: ${MAIL_DOMAIN:-mail.example.internal}
      MAIL_ADMIN_PASSWORD: ${MAIL_ADMIN_PASSWORD:-mail_change_me}
    volumes:
      - mail-data:/opt/stalwart
      - ./volumes/certs:/etc/stalwart/certs:ro
    ports:
      - "25:25"        # SMTP（入站）
      - "465:465"      # SMTPS（客户端提交，强制 TLS）
      - "993:993"      # IMAPS
      - "143:143"      # IMAP（明文端口默认关闭，22 篇 §7）

# =============================================================================
# 数据卷（生产建议宿主独立盘/独立目录 bind mount，便于快照与容量监控）
# =============================================================================
volumes:
  pg-data:            # PG 主数据
  pg-wal-archive:     # WAL 归档 + 基础备份（backup.sh 使用；§4.6）
  bbc-data:           # app 文件域本地盘（BBC_DATA_DIR=/data；对象存储阶段二替换）
  redis-data:
  rustfs-data:        # 对象存储（单节点 2TB 档，§3.3；D29 MinIO→RustFS）
  prometheus-data:
  grafana-data:
  mail-data:

# =============================================================================
# 内联配置（compose spec configs.content；$$ 为 compose 转义，渲染后为单个 $）
# =============================================================================
configs:
  nginx-conf:
    content: |
      # BaobaoChat 接入层 nginx（16 篇 §3.1）
      # —— WSS 会话保持：小规模单 nginx 用 ip_hash 固定客户端→app 实例；
      #    双接入层时必须改按 did 一致性哈希（16 篇 §3.1 要点）——
      worker_processes auto;
      events { worker_connections 4096; }
      http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;
        sendfile on;
        tcp_nopush on;
        keepalive_timeout 65s;

        map $$http_upgrade $$connection_upgrade {
          default upgrade;
          ''      close;
        }

        upstream bbc_app {
          ip_hash;                                  # WSS 会话保持（见上）
          server app:8080 max_fails=3 fail_timeout=10s;
          keepalive 64;
        }
        upstream bbc_update { server update-src:80; }
        upstream bbc_website { server website:80; }

        # —— 80 主入口（D21 v0.1 统一 http）：内网明文全路由——
        #    官网/更新源明文可接受（静态内容 + 安装包 minisign 签名保完整性）；
        #    API/WS 同时挂 443（下方），未来切 https 客户端零改动。
        server {
          listen 80;
          server_name _;
          # 健康检查端点（容器 healthcheck / SLB 探测专用，不记日志）
          location = /healthz { access_log off; return 200 "ok\n"; }

          # REST API
          location /api/ {
            proxy_pass http://bbc_app;
            proxy_set_header Host $$host;
            proxy_set_header X-Real-IP $$remote_addr;
            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $$scheme;
            proxy_read_timeout 60s;
          }

          # WS 长连接（/ws/connect）
          location /ws/ {
            proxy_pass http://bbc_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $$http_upgrade;
            proxy_set_header Connection $$connection_upgrade;
            proxy_set_header Host $$host;
            proxy_set_header X-Forwarded-Proto $$scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
          }

          # 对象存储预签名直传（D25；D29 后端=rustfs）：/oss/ strip 前缀（trailing slash）+
          # Host 透传=SigV4 验签前提（服务端签名按去前缀路径+对外 host 计算，URL 拼回 /oss）
          location /oss/ {
            proxy_pass http://rustfs:9000/;
            proxy_set_header Host $$host;
            proxy_set_header X-Real-IP $$remote_addr;
            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
            client_max_body_size 0;      # 分片 PUT 直穿（8MB/片；应用层已限额）
            proxy_request_buffering off; # 大对象流式转发不落盘缓冲
            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
          }

          # AI 网关 OpenAI 兼容端点（/v1/chat/completions、/v1/embeddings；bbrt 生产链路）
          # SSE 流式：关缓冲，长读超时对齐 bbrt 60s 套接字超时留余量
          location /v1/ {
            proxy_pass http://bbc_app;
            proxy_set_header Host $$host;
            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $$scheme;
            proxy_buffering off;
            proxy_read_timeout 300s;
          }

          # MCP 网关（bbrt corp MCP：POST /mcp/corp）
          location /mcp/ {
            proxy_pass http://bbc_app;
            proxy_set_header Host $$host;
            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $$scheme;
          }

          # 客户端更新清单（D39 动态）+ 制品对象存储直出 + 静态兜底
          location = /update/latest.json {
            proxy_pass http://bbc_app;
            proxy_set_header Host $$host;
            proxy_set_header X-Forwarded-Proto $$scheme;
            proxy_intercept_errors on;
            error_page 404 = @update_static;
          }
          location = /update/release-info.json {
            proxy_pass http://bbc_app;
            proxy_set_header Host $$host;
            proxy_set_header X-Forwarded-Proto $$scheme;
            proxy_intercept_errors on;
            error_page 404 = @update_static;
          }
          # 安装包制品（D39：对象存储直出，不经 app；版本路径不可变 → 长缓存）
          location /update/releases/ {
            proxy_pass http://rustfs:9000/bbc-releases/;
            proxy_set_header Host $$host;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
          }
          # 静态更新源兜底（脚本链路 publish.sh 写 volumes/updates；app 404 时回落）
          location /update/ {
            proxy_pass http://bbc_update/;
          }
          location @update_static {
            proxy_pass http://bbc_update;
          }

          # 官网（静态）
          location / {
            proxy_pass http://bbc_website;
            proxy_set_header Host $$host;
          }
        }

        server {
          listen 443 ssl;
          http2 on;
          server_name _;
          ssl_certificate     /etc/nginx/certs/tls.crt;
          ssl_certificate_key /etc/nginx/certs/tls.key;
          ssl_protocols TLSv1.2 TLSv1.3;
          ssl_session_cache shared:SSL:10m;
          # 大文件上传走预签名直传对象存储，接入层不做 body 限额（应用层限流，07 篇）
          client_max_body_size 0;

          # REST API
          location /api/ {
            proxy_pass http://bbc_app;
            proxy_set_header Host $$host;
            proxy_set_header X-Real-IP $$remote_addr;
            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 60s;
          }

          # WSS 长连接（/ws/connect，14 篇）：升级头透传 + 长读超时
          # （> 心跳 30s 的整数倍，避免接入层空闲断连）
          location /ws/ {
            proxy_pass http://bbc_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $$http_upgrade;
            proxy_set_header Connection $$connection_upgrade;
            proxy_set_header Host $$host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
          }

          # 客户端更新清单（D39 动态）+ 制品对象存储直出 + 静态兜底（443）
          location = /update/latest.json {
            proxy_pass http://bbc_app;
            proxy_set_header Host $$host;
            proxy_set_header X-Forwarded-Proto $$scheme;
            proxy_intercept_errors on;
            error_page 404 = @update_static;
          }
          location = /update/release-info.json {
            proxy_pass http://bbc_app;
            proxy_set_header Host $$host;
            proxy_set_header X-Forwarded-Proto $$scheme;
            proxy_intercept_errors on;
            error_page 404 = @update_static;
          }
          # 安装包制品（D39：对象存储直出，不经 app；版本路径不可变 → 长缓存）
          location /update/releases/ {
            proxy_pass http://rustfs:9000/bbc-releases/;
            proxy_set_header Host $$host;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
          }
          # 静态更新源兜底（脚本链路 publish.sh 写 volumes/updates；app 404 时回落）
          location /update/ {
            proxy_pass http://bbc_update/;
          }
          location @update_static {
            proxy_pass http://bbc_update;
          }

          # 对象存储预签名直传（D25；与 80 块同款——strip 前缀+Host 透传；D29 后端=rustfs）
          location /oss/ {
            proxy_pass http://rustfs:9000/;
            proxy_set_header Host $$host;
            proxy_set_header X-Real-IP $$remote_addr;
            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
          }

          # AI 网关 OpenAI 兼容端点（bbrt 生产链路，D21；SSE 关缓冲）
          location /v1/ {
            proxy_pass http://bbc_app;
            proxy_set_header Host $$host;
            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_buffering off;
            proxy_read_timeout 300s;
          }

          # MCP 网关（bbrt corp MCP，D21）
          location /mcp/ {
            proxy_pass http://bbc_app;
            proxy_set_header Host $$host;
            proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
          }

          # 官网（静态，D21）
          location / {
            proxy_pass http://bbc_website;
            proxy_set_header Host $$host;
          }
        }

      }

  prometheus-conf:
    content: |
      # Prometheus 最小抓取配置（16 篇 §6.1 指标清单由应用侧 /metrics 暴露）
      global:
        scrape_interval: 15s
        evaluation_interval: 15s
      scrape_configs:
        - job_name: prometheus
          static_configs:
            - targets: ["localhost:9090"]
        - job_name: bbc-app
          metrics_path: /metrics
          static_configs:
            - targets: ["app:8080"]
        - job_name: otel-collector
          static_configs:
            - targets: ["otel-collector:8889"]

  otel-conf:
    content: |
      # OTel Collector 最小管线：OTLP 接入 → Prometheus 暴露（16 篇 §6.1/§6.3）
      extensions:
        health_check:
          endpoint: 0.0.0.0:13133
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
      processors:
        batch: {}
      exporters:
        prometheus:
          endpoint: 0.0.0.0:8889
        debug: {}
      service:
        extensions: [health_check]
        telemetry:
          logs:
            level: info
        pipelines:
          metrics:
            receivers: [otlp]
            processors: [batch]
            exporters: [prometheus]
          traces:
            receivers: [otlp]
            processors: [batch]
            # TODO: 后端追踪存储（Tempo/Jaeger）接入后替换 debug
            exporters: [debug]

  updates-src-conf:
    content: |
      # update-src：更新静态源（D21）——清单 no-store / 安装包按版本不可变长缓存
      server {
        listen 80;
        location = /update-ok { access_log off; return 200 "ok\n"; }
        location = /latest.json {
          root /srv/updates;
          add_header Cache-Control "no-store";
        }
        location = /release-info.json {
          root /srv/updates;
          add_header Cache-Control "no-store";
        }
        location /releases/ {
          root /srv/updates;
          add_header Cache-Control "public, max-age=31536000, immutable";
        }
        location / { return 404; }
      }

  website-conf:
    content: |
      # website：官网静态站（D21）——rsync 发布至 volumes/website/；
      # 未发布时根路径回落占位提示（发布后正常 serve index.html 与资产）
      server {
        listen 80;
        location = /website-ok { access_log off; return 200 "ok\n"; }
        location = /index.html {
          root /usr/share/nginx/html;
          add_header Cache-Control "no-store";
        }
        location / {
          root /usr/share/nginx/html;
          index index.html;
          try_files $$uri $$uri/ @placeholder;
        }
        location @placeholder {
          default_type text/plain;
          return 200 "${BBC_BRAND_NAME:-BaobaoChat} 官网尚未发布：先在构建机执行 scripts/release/publish-website.sh\n";
        }
      }
