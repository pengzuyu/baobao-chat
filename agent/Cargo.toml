# BaobaoChat Agent Runtime workspace（D11 §1.2 crate 总览）
# 依赖方向由 CI cargo-deny 强制（禁止环）：protocol ← 所有。
[workspace]
resolver = "2"
members = ["crates/bbrt-protocol", "crates/bbrt-session", "crates/bbrt-sec", "crates/bbrt-memory", "crates/bbrt-store", "crates/bbrt-context", "crates/bbrt-aigw", "crates/bbrt-hostapi", "crates/bbrt-mcp", "crates/bbrt-tools", "crates/bbrt"]

[workspace.package]
version = "0.1.2"
edition = "2021"

# 版本统一在此管理，crate 内只写 workspace = true，禁止散落版本号
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
bbrt-protocol = { path = "crates/bbrt-protocol" }
bbrt-sec = { path = "crates/bbrt-sec" }
bbrt-memory = { path = "crates/bbrt-memory" }
bbrt-store = { path = "crates/bbrt-store" }
bbrt-context = { path = "crates/bbrt-context" }
bbrt-aigw = { path = "crates/bbrt-aigw" }
bbrt-hostapi = { path = "crates/bbrt-hostapi" }
bbrt-mcp = { path = "crates/bbrt-mcp" }
bbrt-tools = { path = "crates/bbrt-tools" }
bbrt-session = { path = "crates/bbrt-session" }

# Runtime 二进制随客户端分发、有 <80MB 空闲内存预算（08 §1.2）：发布构建开全程序 LTO
[profile.release]
lto = true
codegen-units = 1
