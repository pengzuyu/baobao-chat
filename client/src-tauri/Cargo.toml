[package]
name = "baobaochat-client"
version = "0.1.8"
description = "BaobaoChat 客户端（Tauri 2 壳）"
authors = ["BaobaoChat"]
edition = "2021"
rust-version = "1.77.2"

# lib 与 bin 分离（Tauri 2 推荐，便于移动端复用）
[lib]
name = "baobaochat_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# devtools（2026-11-23 开发者模式）：release 构建开放 WebView 调试台（open_devtools
# command，DevPanel·环境 Tab 触发）；debug 构建本就可用，统一带 feature 少一档差异
# protocol-asset（2026-11-26 附件图片）：convertFileSrc 本地图片缩略图/预览——
# scope 运行时经 dialog 授权 + asset_grants 落盘恢复（tauri.conf.json assetProtocol）
tauri = { version = "2", features = ["devtools", "protocol-asset"] }
# 外链一律走系统浏览器（D01 §10），Tauri 2 官方 opener 插件
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
# 目录/文件选择对话框（D13 传输设置下载目录；@tauri-apps/plugin-dialog 前端对应）
tauri-plugin-dialog = "2"
# 自动更新（16 篇 §5.1：ed25519 签名 manifest + /update/ 静态源；pubkey 未配置时禁用）
tauri-plugin-updater = "2"
# WebSocket（0.1.4）：macOS WKWebView 拒绝 tauri:// 页面的 ws:// 出站（custom scheme
# origin 的 socket 限制，dev 的 http://localhost:5173 无此问题）——传输改由 Rust 侧
# 插件连接（@tauri-apps/plugin-websocket 前端对应），WebView 限制不再生效
tauri-plugin-websocket = "2"
# relaunch（D21：更新装完一键重启）
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# D35 定时任务：本地时区日历运算（cron/workday 次日计算；依赖树既有版本；
# 关默认 features 避免把 wasm 依赖带进 lock，只要 clock/std）
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# 插件包落盘（D22 §5.2：前端 fflate 解压后内容 base64 传输；复用依赖树既有版本）
base64 = "0.23"
keyring = "3"
# 稳定设备号（D28 批0）：uuid v4 落 app 配置目录；复用依赖树既有版本
uuid = { version = "1", features = ["v4"] }
# OBO 签发（D28 批0）：宿主持 access 调 /auth/obo/token——blocking+json 足矣；
# rustls 供 https 网关（生产域名）；与 updater 共享依赖树
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
tauri-plugin-deep-link = "2"
url = "2"
# 外部智能体接入面（D30 批1）：本机回环 A2A server——同步极轻，匹配壳内
# blocking 风格，不引 tokio/axum
tiny_http = "0.12"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
