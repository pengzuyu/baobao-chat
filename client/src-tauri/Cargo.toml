[package]
name = "baobaowork-client"
version = "0.1.0"
description = "BaobaoWork 客户端（Tauri 2 壳）"
authors = ["BaobaoWork"]
edition = "2021"
rust-version = "1.77.2"

# lib 与 bin 分离（Tauri 2 推荐，便于移动端复用）
[lib]
name = "baobaowork_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# 外链一律走系统浏览器（D01 §10），Tauri 2 官方 opener 插件
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
# 目录/文件选择对话框（D13 传输设置下载目录；@tauri-apps/plugin-dialog 前端对应）
tauri-plugin-dialog = "2"
# 自动更新（16 篇 §5.1：ed25519 签名 manifest + /update/ 静态源；pubkey 未配置时禁用）
tauri-plugin-updater = "2"
# relaunch（D21：更新装完一键重启）
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 插件包落盘（D22 §5.2：前端 fflate 解压后内容 base64 传输；复用依赖树既有版本）
base64 = "0.23"
keyring = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
