[package]
name = "bbw-cli"
version = "0.1.0"
edition = "2021"
description = "BaobaoChat 外部智能体接入面 CLI（D30 批2）：bbw ask——把打开中的 BaobaoChat agent 当子智能体调用"

# 独立 crate（不入 agent workspace——RT 依赖方向 cargo-deny 强制，CLI 零依赖
# 手写回环 HTTP 不碰 RT 依赖树；serde_json 唯一依赖）
[[bin]]
name = "bbw"
path = "src/main.rs"

[dependencies]
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
